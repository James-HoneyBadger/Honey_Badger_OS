# ═══════════════════════════════════════════════════════════════════════════════
# Honey Badger OS Configuration File
# ═══════════════════════════════════════════════════════════════════════════════
# This file is sourced by lib/common.sh and controls installer behavior.
# All values here can be overridden by environment variables set before running
# install.sh. Lines beginning with # are comments.
# ═══════════════════════════════════════════════════════════════════════════════

# ── System identification ────────────────────────────────────────────────────
# Version string shown in post-install info and JSON summary
HONEY_BADGER_VERSION="2.0.0"
# Release codename (for branding)
HONEY_BADGER_CODENAME="Fearless"
# Build date (updated on release)
HONEY_BADGER_BUILD_DATE="2026"

# ── Theme settings ───────────────────────────────────────────────────────────
# Hex color values used for GTK theme generation and wallpaper
HONEY_BADGER_THEME_PRIMARY="#8b6914"    # Dark goldenrod (backgrounds, panels)
HONEY_BADGER_THEME_SECONDARY="#daa520"  # Goldenrod (selections, accents)
HONEY_BADGER_THEME_ACCENT="#f5deb3"     # Wheat (text, highlights)
HONEY_BADGER_THEME_BASE="#2d2006"       # Dark brown (base/dark elements)

# ── Editor settings ──────────────────────────────────────────────────────────
# Default editor set in ~/.bashrc during install
EDITOR=nano
VISUAL=nano

# ── Development mode ─────────────────────────────────────────────────────────
# When true: enables verbose (debug) logging automatically.
# Useful for contributors testing changes to the installer.
# Values: true | false
HONEY_BADGER_DEV_MODE=false

# ── Component skip flags (uncomment to disable) ─────────────────────────────
# These can also be set via --skip-* CLI flags or environment variables.
# HONEY_BADGER_SKIP_DOCKER=1   # Skip Docker install and group setup
# HONEY_BADGER_SKIP_PYTHON=1   # Skip Python pip/pipx dev setup
# HONEY_BADGER_SKIP_NODE=1     # Skip Node.js/npm global packages
# HONEY_BADGER_SKIP_NANO=1     # Skip nano editor configuration

# ── Git configuration (for non-interactive installs) ─────────────────────────
# If these are set and Git is unconfigured, the installer uses them automatically.
# HONEY_BADGER_GIT_USERNAME=""
# HONEY_BADGER_GIT_EMAIL=""